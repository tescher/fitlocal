{% extends "base.html" %}
{% block title %}FitLocal - Profile Setup{% endblock %}
{% block content %}
<h1>{{ 'Edit Profile' if profile else 'Profile Setup' }}</h1>

<form method="POST" class="card">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required value="{{ profile.name if profile else '' }}">
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="birthdate">Birthdate <span class="text-muted">(optional)</span></label>
            <input type="date" id="birthdate" name="birthdate"
                   value="{{ profile.birthdate.isoformat() if profile and profile.birthdate else '' }}">
        </div>
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" required min="10" max="120" value="{{ profile.current_age if profile else '' }}">
        </div>
    </div>
    <p class="text-muted mb-2" style="font-size:0.85rem; margin-top:-0.5rem;">Enter a birthdate and your age stays up to date automatically.</p>

    <div class="form-group">
        <label for="sex">Sex</label>
        <select id="sex" name="sex" required>
            <option value="">Select...</option>
            <option value="Male" {{ 'selected' if profile and profile.sex == 'Male' }}>Male</option>
            <option value="Female" {{ 'selected' if profile and profile.sex == 'Female' }}>Female</option>
            <option value="Other" {{ 'selected' if profile and profile.sex == 'Other' }}>Other</option>
        </select>
    </div>

    <div class="form-group">
        <label for="fitness_level">Fitness Level</label>
        <select id="fitness_level" name="fitness_level" required>
            <option value="">Select...</option>
            <option value="Beginner" {{ 'selected' if profile and profile.fitness_level == 'Beginner' }}>Beginner</option>
            <option value="Intermediate" {{ 'selected' if profile and profile.fitness_level == 'Intermediate' }}>Intermediate</option>
            <option value="Advanced" {{ 'selected' if profile and profile.fitness_level == 'Advanced' }}>Advanced</option>
        </select>
    </div>

    <div class="form-group">
        <label for="goals">Goals</label>
        <textarea id="goals" name="goals" required placeholder="e.g. lose weight, build muscle, train for a 5K">{{ profile.goals if profile else '' }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">{{ 'Update Profile' if profile else 'Save & Continue' }}</button>
</form>

<script>
// When a birthdate is entered, it drives the age: fill it in and lock the field.
(function() {
    var birthdate = document.getElementById('birthdate');
    var age = document.getElementById('age');
    var manualAge = age.value;

    function sync() {
        if (!birthdate.value) {
            if (age.readOnly) age.value = manualAge;
            age.readOnly = false;
            age.required = true;
            return;
        }
        if (!age.readOnly) manualAge = age.value;
        var bd = new Date(birthdate.value + 'T00:00:00');
        var today = new Date();
        var years = today.getFullYear() - bd.getFullYear();
        if (today.getMonth() < bd.getMonth() ||
            (today.getMonth() === bd.getMonth() && today.getDate() < bd.getDate())) {
            years--;
        }
        age.value = isNaN(years) ? '' : years;
        age.readOnly = true;
        age.required = false;
    }

    birthdate.addEventListener('input', sync);
    sync();
})();
</script>
{% endblock %}
